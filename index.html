<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Management</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="./assets/css/main.css">
</head>

<body class="min-h-screen p-8 font-sans text-gray-900 bg-gradient-to-br from-gray-50 to-blue-50">

  <h1 class="text-2xl font-bold mb-2">User Management</h1>
<p class="text-gray-500 mb-6">Manage users, edit profiles and control access</p>

  <!-- Add User Form -->
  <div class="bg-white/80 backdrop-blur border border-gray-100 shadow-sm rounded-2xl rounded-xl p-6 mb-6">
    <p class="text-xs font-medium text-gray-400 uppercase tracking-widest mb-4">Add new user</p>

    <form class="addForm" name="addUserForm">
      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-medium text-gray-500">Name</label>
          <input type="text" name="Name" placeholder="Alaa Test"
            class="px-3 py-2 text-sm border border-gray-200 rounded-lg outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition" />
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-medium text-gray-500">Email</label>
          <input type="email" name="Email" placeholder="alaa@example.com"
            class="px-3 py-2 text-sm border border-gray-200 rounded-lg outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition" />
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-medium text-gray-500">Age</label>
          <input type="number" name="Age" placeholder="30"
            class="px-3 py-2 text-sm border border-gray-200 rounded-lg outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition" />
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-medium text-gray-500">Profile image</label>
          <label
            class="flex items-center gap-2 px-3 py-2 text-sm border border-dashed border-gray-300 rounded-lg text-gray-400 cursor-pointer hover:border-blue-400 hover:text-blue-500 transition">
            <svg class="w-4 h-4 shrink-0" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.2" />
              <circle cx="5.5" cy="5.5" r="1" fill="currentColor" />
              <path d="M2 11l3-3 2 2 3-3 4 4" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" />
            </svg>
            <span>Choose file</span>
            <input type="file" class="hidden" accept="image/*" />
          </label>
        </div>

      </div>

      <div class="flex justify-end gap-2 mt-5">
        <button
          class="px-4 py-2 text-sm border border-gray-200 rounded-lg text-gray-600 hover:bg-gray-50 transition cursor-pointer">
          Reset
        </button>
        <button class="px-4 py-2 text-sm bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition cursor-pointer">
          Add user
        </button>
      </div>
    </form>

  </div>

  <!-- Users Table -->
  <div class="bg-white/80 backdrop-blur border border-gray-100 shadow-sm rounded-2xl rounded-xl p-6">

    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-2">
        <span class="text-base font-medium">All users</span>
        <span class="text-xs bg-blue-100 text-blue-700 px-3 py-1 rounded-full userCount font-medium"></span>
      </div>
      <button class="px-3 py-1.5 text-xs bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition cursor-pointer">
        + Add
      </button>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full text-sm border-collapse">
        <thead>
          <tr class="bg-gray-50">
            <th
              class="text-left text-xs font-medium text-gray-400 uppercase tracking-wider px-3 py-2.5 border-b border-gray-100 w-10">
              #</th>
            <th
              class="text-left text-xs font-medium text-gray-400 uppercase tracking-wider px-3 py-2.5 border-b border-gray-100">
              Name</th>
            <!-- <th
              class="text-left text-xs font-medium text-gray-400 uppercase tracking-wider px-3 py-2.5 border-b border-gray-100">
              Email</th>
            <th
              class="text-left text-xs font-medium text-gray-400 uppercase tracking-wider px-3 py-2.5 border-b border-gray-100 w-16">
              Age</th> -->
            <th
              class="text-left text-xs font-medium text-gray-400 uppercase tracking-wider px-3 py-2.5 border-b border-gray-100">
              Image</th>
            <th
              class="text-left text-xs font-medium text-gray-400 uppercase tracking-wider px-3 py-2.5 border-b border-gray-100">
              Actions</th>
          </tr>
        </thead>
        <tbody class="userTable">

          <div class="loader"></div>

        </tbody>
      </table>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="./assets/JS/main.js"> </script>
</body>

</html>
